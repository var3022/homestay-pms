spring.application.name=homestay-pms

# Flyway Migration Configuration (Dedicated schema migration role: pms_admin)
# Disabled by default to prevent accidental auto-migration on boot
# Execution requires explicit opt-in via SPRING_FLYWAY_ENABLED=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:pms_admin}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:}

# Application Runtime Datasource (Restricted least-privilege role: pms_app)
# Credentials must be supplied via environment; no hardcoded password fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestay_pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Authentication Runtime Datasource (Least-privilege role: pms_auth)
# Explicitly controlled via AUTH_DATASOURCE_ENABLED during development phase.
# Defaults to false so ordinary PMS startup does not require pms_auth credentials until auth system is deployed.
# When enabled, missing or invalid pms_auth credentials fail closed on startup.
auth.datasource.enabled=${AUTH_DATASOURCE_ENABLED:false}
auth.datasource.url=${AUTH_DATASOURCE_URL:${spring.datasource.url}}
auth.datasource.username=${AUTH_DATASOURCE_USERNAME:pms_auth}
auth.datasource.password=${AUTH_DATASOURCE_PASSWORD:}
auth.datasource.driver-class-name=${AUTH_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata

# JWT Access-Token Configuration
# Disabled by default so ordinary PMS startup does not require JWT secrets until auth system is deployed
jwt.enabled=${JWT_ENABLED:false}
jwt.issuer=${JWT_ISSUER:homestay-pms}
jwt.audience=${JWT_AUDIENCE:homestay-pms-client}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.active-key-id=${JWT_ACTIVE_KEY_ID:k1}
jwt.keys.k1=${JWT_KEY_K1:}
jwt.keys.k2=${JWT_KEY_K2:}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:60}

# Trusted Reverse Proxy Boundary for Authentication
# Comma-separated list of trusted proxy IP addresses; empty by default (zero-trust remoteAddr)
auth.proxy.trusted-proxies=${AUTH_TRUSTED_PROXIES:}

# Refresh-Token Cookie Configuration
# Production HTTPS policy: secure=true, __Host-pms-refresh name, SameSite=Strict, Path=/
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.allow-insecure-dev-mode=${AUTH_COOKIE_ALLOW_INSECURE_DEV_MODE:false}
auth.cookie.name=${AUTH_COOKIE_NAME:}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
auth.cookie.path=${AUTH_COOKIE_PATH:/}
auth.cookie.ttl-days=${AUTH_COOKIE_TTL_DAYS:7}

# Origin and CSRF Defense Configuration
auth.origin.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
auth.origin.allow-trusted-server-requests=${AUTH_ALLOW_TRUSTED_SERVER_REQUESTS:false}
auth.origin.trusted-server-header=${AUTH_TRUSTED_SERVER_HEADER:X-PMS-Internal-Source}
auth.origin.trusted-server-token=${AUTH_TRUSTED_SERVER_TOKEN:pms-internal-proxy}
