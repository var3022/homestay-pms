spring.application.name=homestay-pms

# Flyway Migration Safety: Disabled by default to prevent accidental auto-migration on boot
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# PostgreSQL Datasource (Credentials must be supplied via environment; no hardcoded password fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestay_pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata