spring.application.name=homestay-pms

# Flyway Migration Configuration (Dedicated schema migration role: pms_admin)
# Disabled by default to prevent accidental auto-migration on boot
# Execution requires explicit opt-in via SPRING_FLYWAY_ENABLED=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:pms_admin}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:}

# Application Runtime Datasource (Restricted least-privilege role: pms_app)
# Credentials must be supplied via environment; no hardcoded password fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestay_pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Authentication Runtime Datasource (Least-privilege role: pms_auth)
# Explicitly controlled via AUTH_DATASOURCE_ENABLED during development phase.
# Defaults to false so ordinary PMS startup does not require pms_auth credentials until auth system is deployed.
# When enabled, missing or invalid pms_auth credentials fail closed on startup.
auth.datasource.enabled=${AUTH_DATASOURCE_ENABLED:false}
auth.datasource.url=${AUTH_DATASOURCE_URL:${spring.datasource.url}}
auth.datasource.username=${AUTH_DATASOURCE_USERNAME:pms_auth}
auth.datasource.password=${AUTH_DATASOURCE_PASSWORD:}
auth.datasource.driver-class-name=${AUTH_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata