spring.application.name=homestay-pms

# Flyway Migration Configuration (Dedicated schema migration role: pms_admin)
# Disabled by default to prevent accidental auto-migration on boot
# Execution requires explicit opt-in via SPRING_FLYWAY_ENABLED=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:pms_admin}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:}

# Application Runtime Datasource (Restricted least-privilege role: pms_app)
# Credentials must be supplied via environment; no hardcoded password fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homestay_pms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pms_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata