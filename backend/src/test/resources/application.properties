spring.application.name=homestay-pms-test

# Flyway: Disabled by default in automated tests to prevent unintended schema mutations
# When enabled for migration tests, connects as dedicated pms_admin role
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
spring.flyway.url=${TEST_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${TEST_FLYWAY_USER:pms_admin}
spring.flyway.password=${TEST_FLYWAY_PASSWORD:}

# Isolated Disposable PostgreSQL 16 Datasource (Port 5433 ONLY - Strictly isolated)
# Port 5432 is strictly prohibited and blocked by TestDatabaseSafetyInitializer
# Runtime tests run as restricted pms_app role
# Credentials must be supplied via TEST_DATASOURCE_PASSWORD; no hardcoded password fallback
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/v7_disposable_db}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:pms_app}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dedicated Authentication Datasource for tests (pms_auth on Port 5433 ONLY)
# Port 5432 is strictly prohibited and blocked by TestDatabaseSafetyInitializer
# Independent credentials: must use TEST_AUTH_DATASOURCE_PASSWORD; no silent reuse of primary password
auth.datasource.enabled=${TEST_AUTH_DATASOURCE_ENABLED:true}
auth.datasource.url=${TEST_AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5433/v7_disposable_db}
auth.datasource.username=${TEST_AUTH_DATASOURCE_USERNAME:pms_auth}
auth.datasource.password=${TEST_AUTH_DATASOURCE_PASSWORD:}
auth.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata

# JWT Access-Token Configuration for tests
jwt.enabled=${TEST_JWT_ENABLED:true}
jwt.issuer=${TEST_JWT_ISSUER:homestay-pms-test}
jwt.audience=${TEST_JWT_AUDIENCE:homestay-pms-test-client}
jwt.access-token-ttl-seconds=${TEST_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.active-key-id=${TEST_JWT_ACTIVE_KEY_ID:k1}
jwt.keys.k1=${TEST_JWT_KEY_K1:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
jwt.keys.k2=${TEST_JWT_KEY_K2:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDI=}

# Register context initializer to enforce safety checks across all Spring Boot tests
context.initializer.classes=com.homestay.pms_backend.test.TestDatabaseSafetyInitializer
