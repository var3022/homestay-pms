spring.application.name=homestay-pms-test

# Flyway: Disabled by default in automated tests to prevent unintended schema mutations
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}

# Isolated Disposable PostgreSQL 16 Datasource (Port 5433 ONLY - Strictly isolated)
# Port 5432 is strictly prohibited and blocked by TestDatabaseSafetyInitializer
# Credentials must be supplied via TEST_DATASOURCE_PASSWORD; no hardcoded password fallback
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/v7_disposable_db}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:pms_admin}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for tests
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Application timezone
spring.jackson.time-zone=Asia/Kolkata

# Register context initializer to enforce safety checks across all Spring Boot tests
context.initializer.classes=com.homestay.pms_backend.test.TestDatabaseSafetyInitializer
